services:
  - type: web
    name: expense-tracker
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm run build
    startCommand: pnpm run start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: expense-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
